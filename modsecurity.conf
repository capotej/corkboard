# mod_security v2 engine config. Phase 1 = DetectionOnly: every CRS rule runs
# and LOGS (to the Apache error log -> Fly -> Grafana), nothing is blocked.
# Flip SecRuleEngine to On for Phase 2 (rfcs/2026-07-25_owasp-crs-waf.md).
#
# This is a trimmed modsecurity.conf-recommended carrying only our Phase-1
# choices; it is the SOLE engine config (security2.conf includes
# /etc/modsecurity/*.conf, and the Debian package ships no active
# modsecurity.conf -- only -recommended). It must load BEFORE the CRS rules
# (crs-setup.conf + rules/*.conf), which it does: mods-enabled/ is included
# before conf-enabled/ in apache2.conf, so security2.conf -> this file runs
# before conf-enabled/modsecurity-crs.conf pulls in CRS.

# --- Engine mode -------------------------------------------------------
# DetectionOnly: rules evaluate and log, but never block. Phase 2 flips to On.
SecRuleEngine DetectionOnly

# --- Telemetry: OFF (no phone-home) ------------------------------------
# The Status engine phones anonymized usage stats back to the ModSecurity
# project. Off by default; mod_security still logs a one-time notice nudging
# you to enable it. Set Off explicitly to (a) silence that notice and (b) make
# the no-phone-home posture belt-and-suspenders -- this image already disables
# DokuWiki's updatecheck + the popularity plugin for the same reason (README).
SecStatusEngine Off

# --- Request body inspection (the whole point of Phase 1) --------------
# MUST be On: page content arrives as a JSON-RPC POST body (core.putPage) and
# as form POSTs (do=save). Without this, mod_security never sees bodies and
# Phase 1 collects nothing. Defaults to Off, so we set it explicitly.
SecRequestBodyAccess On

# Overall body ceiling: anything larger is rejected BEFORE inspection (413).
# ~13 MiB -- ample for page saves. The constraint that actually bites media
# uploads is SecRequestBodyNoFilesLimit (below), NOT this one.
SecRequestBodyLimit 13107200

# The portion of the body NOT from multipart file uploads (form fields + JSON).
# mod_security's compiled-in default is only 1 MiB (1048576) -- and the corkboard
# agent uploads media via JSON-RPC core.saveMedia, which base64-encodes the file
# INSIDE the JSON body (not a multipart file part), so the whole payload counts
# as "no files data". A 1.0 MiB file (~1.3 MiB base64) was therefore rejected at
# the 1 MiB default even though SecRequestBodyLimit would allow it. ALL agent
# traffic is JSON-RPC (zero multipart file parts), so the files/no-files split is
# meaningless here -- set NoFilesLimit to track SecRequestBodyLimit so there is a
# single upload ceiling. (Constraint: must be <= SecRequestBodyLimit.) Note this
# limit is enforced even in DetectionOnly, so it was a real Phase-1 blocker, not
# a Phase-2 tuning item. Bump these two together.
SecRequestBodyNoFilesLimit 13107200

# Bodies above this byte count spill to a temp file in SecTmpDir (below) rather
# than RAM. Default 128 KiB; left at default so a large page save is still
# inspected, just via the temp file.
SecRequestBodyInMemoryLimit 131072

# Temp dirs mod_security needs to stage request bodies (multipart/large) for
# inspection. The Debian package creates /var/cache/modsecurity.
SecTmpDir /tmp
SecDataDir /var/cache/modsecurity

# --- Response body inspection: OFF -------------------------------------
# Inbound is where the value is for DokuWiki. Response inspection would scan
# rendered HTML (noisy false positives) and carries a documented RFDoS risk
# (a regex driven by attacker-controlled response content). Deliberate Phase-1
# choice (Decision #7).
SecResponseBodyAccess Off

# --- Audit log: OFF by default (Decision #5) ---------------------------
# Detection signal goes to the ERROR LOG -> Fly -> Grafana, which is already
# durable for all our logs. The verbose SecAuditLog (full request/response
# bodies) is an ESCALATION path: turn on SecAuditEngine RelevantOnly + point
# SecAuditLog at the persistent volume (/dokuwiki-persistent/modsec/, with
# rotation) only for rules the error-log line can't disambiguate. Kept off
# because it captures page-content bodies (sensitive) and is chatty.
SecAuditEngine Off
# Dormant: only consulted if SecAuditEngine is RelevantOnly. Matches 5xx and
# non-404 4xx -- the statuses worth a full audit record once enabled.
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ

# --- JSON body processor for the agent's JSON-RPC ----------------------
# Rule 200001 is upstream's blessed default (modsecurity.conf-recommended):
# route application/json bodies through the JSON parser so CRS inspects the
# structured payload, not raw bytes. The corkboard agent sends exactly this
# Content-Type. CRS already allows application/json (rule 920420), so this just
# enables the parser. For non-standard JSON variants (e.g. application/cloudevents
# +json) you'd add a per-content-type rule of the same shape (see crs-setup notes).
SecRule REQUEST_HEADERS:Content-Type "application/json" \
    "id:200001,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"
