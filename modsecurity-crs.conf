# Pulls OWASP CRS 4 into Apache in the required order, guarded so Apache still
# starts (without CRS) if the security2 module somehow isn't loaded.
# rfcs/2026-07-25_owasp-crs-waf.md
#
# Load order is load-bearing (CRS docs are explicit):
#   1. modsecurity.conf  -- the engine (SecRuleEngine, SecRequestBodyAccess,
#      audit settings). Loaded by mods-enabled/security2.conf via its
#      `IncludeOptional /etc/modsecurity/*.conf`.
#   2. crs-setup.conf    -- paranoia level, default actions, allowed
#      methods/content-types. Loaded below.
#   3. rules/*.conf      -- the CRS rules themselves. Loaded below.
# Because mods-enabled/ is included BEFORE conf-enabled/ in apache2.conf, the
# engine config in step 1 is guaranteed to be in place by the time this file
# (in conf-enabled/) runs steps 2 and 3. Getting this order wrong means CRS
# silently runs with wrong defaults.
<IfModule security2_module>
    IncludeOptional /etc/modsecurity/crs/crs-setup.conf
    # Our before-CRS exclusions (crs-exclusions.conf): operational/static-asset
    # exclusions today (e.g. the favicon healthcheck), Phase-2 content-rule FP
    # exclusions later. Loaded BEFORE the rules so ctl:ruleEngine=Off /
    # SecRuleRemoveById entries take effect before any CRS rule fires. The file
    # lives in crs/ (NOT /etc/modsecurity/) so Debian security2.conf's
    # `IncludeOptional /etc/modsecurity/*.conf` glob can't double-load it.
    IncludeOptional /etc/modsecurity/crs/crs-exclusions.conf
    IncludeOptional /etc/modsecurity/crs/rules/*.conf
</IfModule>
