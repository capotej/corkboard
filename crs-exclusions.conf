# DokuWiki / corkboard exclusions, loaded BEFORE the CRS rules (see
# modsecurity-crs.conf). Decision #8 of rfcs/2026-07-25_owasp-crs-waf.md: one
# reviewed file for both (a) operational/static-asset exclusions like the one
# below and (b) the Phase-2 content-rule false-positive exclusions written from
# the Phase-1 detection inventory.
#
# This file runs in phase:1 before REQUEST-901-INITIALIZATION, so a
# `ctl:ruleEngine=Off` here disables the engine for the whole transaction
# (phase 2-5 skipped) before any CRS rule fires. Keep exclusions NARROWLY
# scoped: a path or a rule id per confirmed need, never a global weakening.

# --- Healthcheck / static favicon (Phase 1 operational) ----------------
# Fly's HTTP healthcheck (fly.toml) does a bare GET on this static .ico every
# 10s. It is a parameterless static asset with no attack surface, but in
# DetectionOnly it tripped minor PL1 protocol rules (e.g. missing Accept
# header), which pushed tx.detection_anomaly_score above 0 and -- with the CRS
# default tx.reporting_level=4 -- fired rule 980170's per-request score
# summary into the error log -> Grafana on every check. Disable the WAF engine
# for favicon fetches entirely (healthcheck + browser favicon requests both).
# Not a security trade-off: a static .ico has no input the WAF could inspect.
SecRule REQUEST_URI "@rx (?i)/favicon\.ico$" \
    "id:100001,phase:1,pass,nolog,ctl:ruleEngine=Off"

