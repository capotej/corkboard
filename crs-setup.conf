# OWASP CRS 4 setup. Phase 1: paranoia level 1 (the default), anomaly-scoring
# defaults, and a logging action that writes to the ERROR LOG only (-> Fly ->
# Grafana) -- no audit log. Phase 2 (rfcs/2026-07-25_owasp-crs-waf.md) raises
# the inbound anomaly threshold here and writes crs-exclusions.conf.
#
# This is a minimal, hand-written replacement for the upstream
# crs-setup.conf.example: we only state the Phase-1 deviations from the CRS
# defaults. Everything else (allowed methods include POST; allowed content-types
# include application/json + multipart/form-data; anomaly-scoring mode; the
# default inbound threshold of 5) is already the CRS default out of the box, so
# restating it would just be noise that drifts from upstream. Override only
# what you mean to change.

# --- Default action: log to the error log, no audit log ----------------
# Upstream default is "phase:N,log,auditlog,pass". We drop auditlog so page-
# content bodies don't land in the shared log store / a chatty audit file --
# all signal still reaches Grafana via the error log. (Decision #5.) Phase 2
# flips the phase:2 line to deny on a block; phase:1 stays pass (it sets up
# variables). Per CRS, exactly two SecDefaultAction lines are allowed: phase:1
# and phase:2.
SecDefaultAction "phase:1,log,noauditlog,pass"
SecDefaultAction "phase:2,log,noauditlog,pass"

# --- Paranoia level 1 (the default; stated explicitly) ------------------
# PL1 = "most core rules, you should face FPs rarely" -- the documented
# balanced starting point (Decision #4). REQUEST-901-INITIALIZATION already
# defaults tx.blocking_paranoia_level to 1 when unset, so this is belt-and-
# suspenders: it makes the active paranoia level grep-able in the image.
# tx.detection_paranoia_level is not set, so it tracks blocking_paranoia_level
# (the CRS default). Phase 2 tunes the threshold, NOT the paranoia level.
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.blocking_paranoia_level=1"

# --- Phase 2 knob (documented, NOT active in Phase 1) -------------------
# When flipping SecRuleEngine On, start with an ELEVATED inbound anomaly score
# threshold (CRS's "start high and decrease") so a single CRITICAL match
# doesn't block, then lower toward the default 5 as exclusions mature:
#
#   SecAction "id:900110,phase:1,pass,nolog,\
#       setvar:tx.inbound_anomaly_score_threshold=8"
#
# In DetectionOnly this line has no effect (nothing blocks regardless of
# threshold), so it's left commented out to keep Phase 1 honest about intent.

# --- Setup-version marker (REQUIRED) -----------------------------------
# CRS rule 901001 (REQUEST-901-INITIALIZATION.conf) checks that this variable
# is set; if absent it fires a CRITICAL "CRS is deployed without configuration!"
# on every request (deny/status:500, downgraded to a log by DetectionOnly but
# still noise + a sign the setup wasn't recognized). Any non-empty value
# satisfies 901001, but we set the release's numerical version for honesty /
# traceability in logs. MUST track CRS_VERSION in the Dockerfile: v4.28.0 ->
# 4280 (recompute from the new release's crs-setup.conf.example when bumping).
SecAction \
    "id:900990,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:tx.crs_setup_version=4280"
