# Strip the orphaned Pragma header from media responses.
#
# DokuWiki serves media (logo.png, uploads, ...) through lib/exe/fetch.php ->
# sendFile() (inc/fetch.functions.php). sendFile() sets its own Expires +
# Cache-Control (e.g. `private, no-transform, max-age=86400`) but never a Pragma.
# Meanwhile inc/init.php's session_start() runs under PHP's default
# session.cache_limiter=nocache, which queues `Pragma: no-cache` (plus a stale
# Expires/Cache-Control) BEFORE fetch.php's session_write_close(). sendFile()'s
# header() calls overwrite Expires/Cache-Control (header() replaces by default)
# but leave the Pragma in place, so media responses ship with contradictory
# headers: a day-long max-age AND `Pragma: no-cache`.
#
# Pragma is HTTP/1.0 and ignored by modern clients/caches (Cache-Control wins),
# but it's contradictory noise that can defeat HTTP/1.0 proxies and confuses
# debugging. mod_headers (a2enmod'd in the Dockerfile) runs on the same
# headers_out table PHP populated, so `unset` reliably removes it. We OMIT Pragma
# rather than set it: Cache-Control is authoritative for HTTP/1.1+, and
# `Pragma: public` (what css.php/js.php emit via http_cached()) is legacy fluff
# we don't need to replicate for media.
#
# Scoped to the media endpoint ONLY -- clean URL (/_media/...) and legacy
# (/lib/exe/fetch.php) -- so this never touches wiki PAGES, which legitimately
# rely on the session limiter's no-cache to stay uncacheable: page output
# (http_cached_finish) emits no cache headers of its own. css.php/js.php set
# their own `Pragma: public` (http_cached), so they need no help here either.
#
# Independent of xsendfile (the leak happens with or without it) but grouped
# conceptually under "media delivery response hygiene". This is an Apache-side
# workaround for a DokuWiki core quirk, not core itself; see local.protected.php
# for the related (orthogonal) sendcache setting.

<IfModule mod_headers.c>
    # Match both URL shapes: the clean /_media/... form and the rewritten/
    # legacy /lib/exe/fetch.php form. The per-directory RewriteRule in
    # rewrite.conf re-injects /_media/... as lib/exe/fetch.php?media=..., so
    # either alternative catches the clean case; listing both is belt-and-
    # suspenders so it holds regardless of which URI <LocationMatch> evaluates.
    <LocationMatch "^/(?:_media/|lib/exe/fetch\.php)">
        Header unset Pragma
    </LocationMatch>
</IfModule>
